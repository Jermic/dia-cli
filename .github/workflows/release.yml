name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 .github/scripts/test-should-test.py
      - id: plan
        run: python3 .github/scripts/should-test.py

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Build native binary
        env:
          CGO_ENABLED: '0'
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o bin/dia .
          test "$(bin/dia --version)" = "dia $version"
      - run: zsh tests/smoke.zsh
      - run: bin/dia help | grep -F 'dia <command>'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dia-darwin-${{ matrix.arch }}
          path: bin/dia
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dia-darwin-arm64
          path: dist/binaries/arm64
      - uses: actions/download-artifact@v4
        with:
          name: dia-darwin-amd64
          path: dist/binaries/amd64
      - run: go run ./cmd/release --binaries-dir dist/binaries "$GITHUB_REF_NAME"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/"$GITHUB_REF_NAME"/*.tar.gz \
            dist/"$GITHUB_REF_NAME"/checksums.txt \
            dist/"$GITHUB_REF_NAME"/dia-cli.rb \
            --draft --verify-tag --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
